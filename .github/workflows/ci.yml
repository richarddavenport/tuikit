name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt
        run: gofmt -l . | tee /dev/stderr | (! read)
      - name: vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Must be built with a Go >= our go directive (1.25). The action's
          # "latest" resolves to the v1 line, built with go1.24, which refuses
          # to run rather than degrading.
          version: v2.12
      - name: test
        run: go test ./...
      - name: the design system still generates
        run: go run ./cmd/tuikit designsystem -out "$RUNNER_TEMP/ds" -tool tuikit
