name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt
        run: gofmt -l . | tee /dev/stderr | (! read)
      - name: vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: test
        run: go test ./...
      - name: the design system still generates
        run: go run ./cmd/tuikit designsystem -out "$RUNNER_TEMP/ds" -tool tuikit
