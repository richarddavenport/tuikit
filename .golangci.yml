# golangci-lint v2 config. Run: golangci-lint run ./...
version: "2"

# Every instance, not the first three. A linter that reports "3 of these" and
# stops makes a clean run look like progress while the same fault is still
# there twice more.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - errname
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    revive:
      rules:
        - name: exported # exported identifiers need doc comments
        - name: package-comments
          disabled: true # package docs required only where they add value
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - prealloc
          # A test helper taking the width it is always called with reads
          # better than one that hard-codes it, and is what the next case
          # needs when it varies.
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
